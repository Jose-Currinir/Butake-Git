[package]
name = "butake-git-engine"
version = "0.2.0"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "rt-multi-thread", "macros", "io-util"] }
portable-pty = "0.9"
shell-words = "1"
tempfile = "3"
